<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AutoLog Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0b1329);
      color: var(--tg-theme-text-color, #f8fafc);
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased selection:bg-blue-600 selection:text-white custom-scroll">

  <!-- ШАПКА: ВЫБОР АВТО И ПРОБЕГ -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-slate-900/90 border-b border-slate-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <button id="garageBtn" class="flex items-center gap-2 bg-slate-800/90 hover:bg-slate-700/80 px-3 py-1.5 rounded-xl border border-slate-700 transition">
        <i class="ph ph-car text-blue-400 text-lg"></i>
        <div class="text-left">
          <div class="text-xs font-semibold leading-tight flex items-center gap-1">
            <span id="hdrCarName">Загрузка...</span>
            <i class="ph ph-caret-down text-slate-400 text-xs"></i>
          </div>
          <div id="hdrCarSub" class="text-[10px] text-slate-400 font-mono">...</div>
        </div>
      </button>

      <div class="flex items-center gap-1 bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700">
        <i class="ph ph-gauge text-slate-400 text-sm"></i>
        <span id="hdrKmDisplay" class="font-mono text-xs font-bold text-slate-200">0 км</span>
        <button id="updateKmBtn" class="ml-1 text-blue-400 hover:text-blue-300 p-0.5">
          <i class="ph ph-pencil-simple text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="px-4 py-4 space-y-5 max-w-lg mx-auto">

    <!-- БЛОК 1: РЕГУЛЯРНОЕ ТО -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i class="ph ph-drop text-amber-400"></i> Регулярное ТО
        </h2>
        <button id="openSettingsBtn" class="text-[11px] text-blue-400 hover:underline flex items-center gap-1">
          <i class="ph ph-gear"></i> Интервалы
        </button>
      </div>

      <!-- Масло -->
      <div id="card-oil" class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2"></div>

      <!-- Сетка фильтров -->
      <div class="grid grid-cols-2 gap-2">
        <div id="card-fuel_filter" class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5"></div>
        <div id="card-air_filter" class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5"></div>
        <div id="card-cabin_filter" class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5"></div>
        <div id="card-spark_plugs" class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5"></div>
      </div>
    </section>

    <!-- БЛОК 2: ТОРМОЗА И ГРМ -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i class="ph ph-disc text-rose-400"></i> Узлы и тормоза
        </h2>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3">
        <div id="card-timing_belt" class="space-y-1"></div>
        <div id="card-brake_pads" class="space-y-1 pt-2 border-t border-slate-800/80"></div>
        <div id="card-brake_discs" class="space-y-1 pt-2 border-t border-slate-800/80"></div>
      </div>
    </section>

    <!-- БЛОК 3: ХОДОВАЯ И РЕМОНТЫ -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i class="ph ph-wrench text-blue-400"></i> Ходовая и другие работы
        </h2>
      </div>
      <div id="repairsList" class="space-y-2"></div>
    </section>

    <!-- БЛОК 4: AI ПОДБОР ДЕТАЛЕЙ ПО VIN -->
    <section class="bg-gradient-to-r from-blue-900/30 to-indigo-900/30 border border-blue-800/40 rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-blue-300 flex items-center gap-1.5">
          <i class="ph ph-sparkle text-blue-400"></i> AI-подбор артикулов
        </span>
        <span class="text-[10px] text-slate-400 font-mono" id="aiVinHint">VIN: Не указан</span>
      </div>
      <div class="flex gap-2">
        <input id="aiPartQuery" type="text" placeholder="Напр.: комплект сцепления или передние колодки" class="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none focus:border-blue-500">
        <button id="aiFindPartBtn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-3 py-2 rounded-xl text-xs font-semibold text-white transition flex items-center gap-1">
          <span>Найти</span>
        </button>
      </div>
      <div id="aiPartResult" class="text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-800 hidden whitespace-pre-line leading-relaxed"></div>
    </section>

  </main>

  <!-- ПЛАВАЮЩАЯ КНОПКА (+) -->
  <button id="openAddModalBtn" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-90 text-white flex items-center justify-center shadow-xl shadow-blue-600/40 z-40 transition">
    <i class="ph ph-plus text-2xl font-bold"></i>
  </button>

  <!-- МОДАЛКА 1: ДОБАВИТЬ ЗАПИСЬ / ТО -->
  <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl w-full max-w-lg p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-bold text-slate-200">Добавить запись</h3>
        <button class="closeModalBtn text-slate-400 hover:text-white p-1"><i class="ph ph-x text-lg"></i></button>
      </div>

      <!-- Фото детали / чека с AI распознаванием -->
      <label class="w-full py-3 px-4 border border-dashed border-blue-500/40 bg-blue-500/10 hover:bg-blue-500/20 rounded-2xl flex items-center justify-center gap-2 text-blue-400 transition cursor-pointer">
        <i class="ph ph-camera text-xl"></i>
        <span id="photoStatusText" class="text-xs font-medium">Сфотографировать деталь или чек (AI)</span>
        <input id="aiPhotoInput" type="file" accept="image/*" class="hidden">
      </label>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-400 font-medium">Что делалось / Название запчасти</label>
          <input id="entryTitle" type="text" placeholder="Напр.: Передние стойки или Комплект ТО" class="w-full mt-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] text-slate-400 font-medium">Пробег (км)</label>
            <input id="entryKm" type="number" class="w-full mt-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-mono text-slate-200 outline-none">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 font-medium">Стоимость</label>
            <input id="entryCost" type="text" placeholder="150 PLN или 1200 грн" class="w-full mt-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-mono text-slate-200 outline-none">
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 font-medium mb-1 block">Обновить ресурс (галочки для ТО):</label>
          <div class="grid grid-cols-3 gap-1.5 text-xs">
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-oil" class="rounded text-blue-600"> Масло
            </label>
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-fuel_filter" class="rounded text-blue-600"> Топливный
            </label>
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-air_filter" class="rounded text-blue-600"> Воздушный
            </label>
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-cabin_filter" class="rounded text-blue-600"> Салонный
            </label>
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-brake_pads" class="rounded text-blue-600"> Колодки
            </label>
            <label class="flex items-center gap-1.5 bg-slate-800 p-2 rounded-lg border border-slate-700 text-slate-300 cursor-pointer">
              <input type="checkbox" id="chk-timing_belt" class="rounded text-blue-600"> ГРМ
            </label>
          </div>
        </div>

        <button id="saveEntryBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-xl text-xs font-bold transition">
          Сохранить запись
        </button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА 2: УПРАВЛЕНИЕ ГАРАЖОМ -->
  <div id="garageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl w-full max-w-lg p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-bold text-slate-200">Мой Гараж</h3>
        <button class="closeModalBtn text-slate-400 hover:text-white p-1"><i class="ph ph-x text-lg"></i></button>
      </div>

      <div id="carsList" class="space-y-2"></div>

      <!-- Форма добавления нового авто по VIN -->
      <div class="pt-3 border-t border-slate-800 space-y-2.5">
        <div class="text-xs font-semibold text-slate-300">Добавить автомобиль:</div>
        <div class="flex gap-2">
          <input id="newCarVin" type="text" placeholder="Введите VIN-код (17 знаков)" class="flex-1 uppercase font-mono bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none focus:border-blue-500">
          <button id="decodeVinBtn" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-xl text-xs font-semibold text-white flex items-center gap-1">
            <i class="ph ph-sparkle"></i> <span>AI</span>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input id="newCarName" type="text" placeholder="Марка и модель" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none">
          <input id="newCarSub" type="text" placeholder="Двигатель / Год" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none">
        </div>
        <input id="newCarKm" type="number" placeholder="Начальный пробег (км)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-slate-200 outline-none">
        <button id="addNewCarBtn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition">
          + Сохранить авто в гараж
        </button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА 3: НАСТРОЙКА ИНТЕРВАЛОВ -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl w-full max-w-lg p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-bold text-slate-200">Интервалы обслуживания (км)</h3>
        <button class="closeModalBtn text-slate-400 hover:text-white p-1"><i class="ph ph-x text-lg"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="text-slate-400">Масло и фильтр</label>
          <input id="int-oil" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
        <div>
          <label class="text-slate-400">Топливный фильтр</label>
          <input id="int-fuel_filter" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
        <div>
          <label class="text-slate-400">Воздушный фильтр</label>
          <input id="int-air_filter" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
        <div>
          <label class="text-slate-400">Салонный фильтр</label>
          <input id="int-cabin_filter" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
        <div>
          <label class="text-slate-400">Комплект ГРМ</label>
          <input id="int-timing_belt" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
        <div>
          <label class="text-slate-400">Тормозные колодки</label>
          <input id="int-brake_pads" type="number" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-200">
        </div>
      </div>
      <button id="saveIntervalsBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
        Сохранить настройки
      </button>
    </div>
  </div>

  <script>
    // Токен Gemini API
    const GEMINI_API_KEY = "ВСТАВЬ_СЮДА_СВОЙ_GEMINI_KEY";

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const userId = tg?.initDataUnsafe?.user?.id || 'demo_user';
    const storageKey = `autolog_data_${userId}`;

    // Начальное состояние
    const defaultData = {
      activeCarId: 'car_1',
      cars: [
        {
          id: 'car_1',
          name: 'Opel Astra J',
          sub: '1.7 CDTI (130 hp)',
          vin: 'W0LPD8EK...',
          currentKm: 218500,
          intervals: {
            oil: 10000,
            fuel_filter: 30000,
            air_filter: 15000,
            cabin_filter: 15000,
            timing_belt: 100000,
            brake_pads: 35000,
            brake_discs: 70000,
            spark_plugs: 60000
          },
          lastReplacedKm: {
            oil: 210000,
            fuel_filter: 195000,
            air_filter: 210000,
            cabin_filter: 210000,
            timing_belt: 150000,
            brake_pads: 205000,
            brake_discs: 180000,
            spark_plugs: 180000
          },
          repairs: [
            { title: 'Стойки стабилизатора (Lemförder)', km: 215000, cost: '160 PLN' }
          ]
        }
      ]
    };

    let appData = JSON.parse(localStorage.getItem(storageKey)) || defaultData;

    function saveData() {
      localStorage.setItem(storageKey, JSON.stringify(appData));
      renderApp();
    }

    function getActiveCar() {
      return appData.cars.find(c => c.id === appData.activeCarId) || appData.cars[0];
    }

    // Рендер интерфейса
    function renderApp() {
      const car = getActiveCar();
      if (!car) return;

      document.getElementById('hdrCarName').innerText = car.name;
      document.getElementById('hdrCarSub').innerText = car.sub || car.vin || '';
      document.getElementById('hdrKmDisplay').innerText = `${car.currentKm.toLocaleString()} км`;
      document.getElementById('aiVinHint').innerText = car.vin ? `VIN: ${car.vin}` : 'VIN: не указан';
      document.getElementById('entryKm').value = car.currentKm;

      // Рендер карточки масла
      const oilPassed = car.currentKm - (car.lastReplacedKm.oil || 0);
      const oilLeft = car.intervals.oil - oilPassed;
      const oilPercent = Math.min(100, Math.max(0, (oilPassed / car.intervals.oil) * 100));
      const oilBadge = oilLeft > 0 ? `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-mono">OK</span>` : `<span class="text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full font-mono">ЗАМЕНА</span>`;

      document.getElementById('card-oil').innerHTML = `
        <div class="flex justify-between items-center text-xs font-bold text-slate-300">
          <span class="flex items-center gap-1.5"><i class="ph ph-drop text-amber-400"></i> Моторное масло и фильтр</span>
          ${oilBadge}
        </div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full ${oilLeft < 1000 ? 'bg-rose-500' : 'bg-blue-500'} rounded-full transition-all" style="width: ${oilPercent}%"></div>
        </div>
        <div class="flex justify-between text-[11px] text-slate-400 font-mono">
          <span>Осталось: ${oilLeft > 0 ? oilLeft.toLocaleString() + ' км' : 'Перепробег ' + Math.abs(oilLeft) + ' км'}</span>
          <span>до ${(car.lastReplacedKm.oil + car.intervals.oil).toLocaleString()} км</span>
        </div>
      `;

      // Вспомогательная функция для компактных плиток
      const renderMiniCard = (containerId, title, key, warnKm = 2000) => {
        const passed = car.currentKm - (car.lastReplacedKm[key] || 0);
        const int = car.intervals[key] || 15000;
        const left = int - passed;
        const pct = Math.min(100, Math.max(0, (passed / int) * 100));
        const col = left <= 0 ? 'bg-rose-500' : left < warnKm ? 'bg-amber-500' : 'bg-emerald-500';

        document.getElementById(containerId).innerHTML = `
          <div class="text-xs text-slate-300 font-medium">${title}</div>
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full ${col} rounded-full" style="width: ${pct}%"></div>
          </div>
          <div class="text-[10px] text-slate-400 font-mono">Ост: ${left > 0 ? left.toLocaleString() : '0'} км</div>
        `;
      };

      renderMiniCard('card-fuel_filter', 'Топливный фильтр', 'fuel_filter', 3000);
      renderMiniCard('card-air_filter', 'Воздушный фильтр', 'air_filter');
      renderMiniCard('card-cabin_filter', 'Салонный фильтр', 'cabin_filter');
      renderMiniCard('card-spark_plugs', 'Свечи накала/зажиг.', 'spark_plugs', 5000);

      // Тормоза и ГРМ
      const renderBar = (containerId, title, key) => {
        const passed = car.currentKm - (car.lastReplacedKm[key] || 0);
        const int = car.intervals[key] || 50000;
        const left = int - passed;
        const pct = Math.min(100, Math.max(0, (passed / int) * 100));
        document.getElementById(containerId).innerHTML = `
          <div class="flex justify-between text-xs text-slate-300 mb-1">
            <span class="font-medium">${title}</span>
            <span class="text-slate-400 font-mono">Ост: ${left > 0 ? left.toLocaleString() : '0'} км</span>
          </div>
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full ${left <= 0 ? 'bg-rose-500' : 'bg-blue-500'} rounded-full" style="width: ${pct}%"></div>
          </div>
        `;
      };

      renderBar('card-timing_belt', 'Ремень ГРМ + помпа', 'timing_belt');
      renderBar('card-brake_pads', 'Тормозные колодки', 'brake_pads');
      renderBar('card-brake_discs', 'Тормозные диски', 'brake_discs');

      // Список ремонтов
      const repContainer = document.getElementById('repairsList');
      if (!car.repairs || car.repairs.length === 0) {
        repContainer.innerHTML = `<div class="text-xs text-slate-500 p-3 bg-slate-900/40 rounded-xl text-center">Записей ремонтов пока нет</div>`;
      } else {
        repContainer.innerHTML = car.repairs.slice().reverse().map(r => `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <div class="text-xs font-semibold text-slate-200">${r.title}</div>
              <div class="text-[11px] text-slate-400 font-mono">${r.km.toLocaleString()} км</div>
            </div>
            <div class="text-xs font-mono font-bold text-slate-200">${r.cost || ''}</div>
          </div>
        `).join('');
      }
    }

    // МОДАЛЬНЫЕ ОКНА
    const addModal = document.getElementById('addModal');
    const garageModal = document.getElementById('garageModal');
    const settingsModal = document.getElementById('settingsModal');

    document.getElementById('openAddModalBtn').onclick = () => addModal.classList.remove('hidden');
    document.getElementById('garageBtn').onclick = () => { renderGarage(); garageModal.classList.remove('hidden'); };
    document.getElementById('openSettingsBtn').onclick = () => { renderSettings(); settingsModal.classList.remove('hidden'); };
    document.querySelectorAll('.closeModalBtn').forEach(btn => {
      btn.onclick = () => {
        addModal.classList.add('hidden');
        garageModal.classList.add('hidden');
        settingsModal.classList.add('hidden');
      };
    });

    // БЫСТРОЕ ОБНОВЛЕНИЕ ПРОБЕГА
    document.getElementById('updateKmBtn').onclick = () => {
      const car = getActiveCar();
      const val = prompt('Введите текущие показания одометра (км):', car.currentKm);
      if (val && !isNaN(val)) {
        car.currentKm = parseInt(val, 10);
        saveData();
      }
    };

    // СОХРАНЕНИЕ ЗАПИСИ ТО
    document.getElementById('saveEntryBtn').onclick = () => {
      const car = getActiveCar();
      const title = document.getElementById('entryTitle').value.trim();
      const km = parseInt(document.getElementById('entryKm').value, 10) || car.currentKm;
      const cost = document.getElementById('entryCost').value.trim();

      if (!title) return alert('Укажите название работы или детали');

      car.currentKm = Math.max(car.currentKm, km);

      // Проверяем чекбоксы ТО
      const keys = ['oil', 'fuel_filter', 'air_filter', 'cabin_filter', 'brake_pads', 'timing_belt'];
      keys.forEach(k => {
        const chk = document.getElementById(`chk-${k}`);
        if (chk && chk.checked) {
          car.lastReplacedKm[k] = km;
          chk.checked = false;
        }
      });

      // Сохраняем в историю
      if (!car.repairs) car.repairs = [];
      car.repairs.push({ title, km, cost });

      document.getElementById('entryTitle').value = '';
      document.getElementById('entryCost').value = '';
      addModal.classList.add('hidden');
      saveData();
    };

    // ГАРАЖ: ВЫБОР И ДОБАВЛЕНИЕ
    function renderGarage() {
      const list = document.getElementById('carsList');
      list.innerHTML = appData.cars.map(c => `
        <div class="flex items-center justify-between p-3 rounded-xl border ${c.id === appData.activeCarId ? 'border-blue-500 bg-blue-950/20' : 'border-slate-800 bg-slate-800/40'}">
          <button onclick="selectCar('${c.id}')" class="text-left flex-1">
            <div class="text-xs font-bold text-slate-200">${c.name}</div>
            <div class="text-[10px] text-slate-400 font-mono">${c.sub || ''} | ${c.vin || 'нет VIN'}</div>
          </button>
          ${appData.cars.length > 1 ? `<button onclick="deleteCar('${c.id}')" class="text-rose-400 hover:text-rose-300 p-2"><i class="ph ph-trash text-sm"></i></button>` : ''}
        </div>
      `).join('');
    }

    window.selectCar = (id) => {
      appData.activeCarId = id;
      saveData();
      garageModal.classList.add('hidden');
    };

    window.deleteCar = (id) => {
      if (!confirm('Удалить этот автомобиль из гаража?')) return;
      appData.cars = appData.cars.filter(c => c.id !== id);
      if (appData.activeCarId === id) appData.activeCarId = appData.cars[0].id;
      saveData();
      renderGarage();
    };

    document.getElementById('addNewCarBtn').onclick = () => {
      const name = document.getElementById('newCarName').value.trim();
      const sub = document.getElementById('newCarSub').value.trim();
      const vin = document.getElementById('newCarVin').value.trim().toUpperCase();
      const km = parseInt(document.getElementById('newCarKm').value, 10) || 0;

      if (!name) return alert('Введите марку и модель');

      const newCar = {
        id: 'car_' + Date.now(),
        name,
        sub,
        vin,
        currentKm: km,
        intervals: { ...defaultData.cars[0].intervals },
        lastReplacedKm: { oil: km, fuel_filter: km, air_filter: km, cabin_filter: km, timing_belt: km, brake_pads: km, brake_discs: km, spark_plugs: km },
        repairs: []
      };

      appData.cars.push(newCar);
      appData.activeCarId = newCar.id;
      saveData();
      garageModal.classList.add('hidden');
    };

    // НАСТРОЙКА ИНТЕРВАЛОВ
    function renderSettings() {
      const car = getActiveCar();
      const keys = ['oil', 'fuel_filter', 'air_filter', 'cabin_filter', 'timing_belt', 'brake_pads'];
      keys.forEach(k => {
        const inp = document.getElementById(`int-${k}`);
        if (inp) inp.value = car.intervals[k] || 10000;
      });
    }

    document.getElementById('saveIntervalsBtn').onclick = () => {
      const car = getActiveCar();
      const keys = ['oil', 'fuel_filter', 'air_filter', 'cabin_filter', 'timing_belt', 'brake_pads'];
      keys.forEach(k => {
        const val = parseInt(document.getElementById(`int-${k}`).value, 10);
        if (val) car.intervals[k] = val;
      });
      saveData();
      settingsModal.classList.add('hidden');
    };

    // ==========================================
    // ИНТЕГРАЦИЯ GEMINI API
    // ==========================================

    // 1. Расшифровка VIN через Gemini
    document.getElementById('decodeVinBtn').onclick = async () => {
      const vin = document.getElementById('newCarVin').value.trim().toUpperCase();
      if (!vin || vin.length < 11) return alert('Введите корректный VIN-код');

      const btn = document.getElementById('decodeVinBtn');
      btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i>`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Расшифруй VIN-код: "${vin}". Ответь строго валидным JSON без markdown-кавычек: {"brand_model": "Марка и модель", "engine_year": "Объем, мощность двигателя и год"}`
              }]
            }]
          })
        });
        const data = await response.json();
        let raw = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
        raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
        const res = JSON.parse(raw);
        if (res.brand_model) document.getElementById('newCarName').value = res.brand_model;
        if (res.engine_year) document.getElementById('newCarSub').value = res.engine_year;
      } catch (err) {
        alert('Не удалось распознать VIN через AI. Заполните вручную.');
      } finally {
        btn.innerHTML = `<i class="ph ph-sparkle"></i> <span>AI</span>`;
      }
    };

    // 2. Распознавание фото запчасти / чека через Gemini Vision
    document.getElementById('aiPhotoInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('photoStatusText');
      status.innerText = 'AI анализирует фото детали/чека...';

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: 'Определи по фото запчасти или чека: название детали, артикул/номер, бренд и стоимость (если чек). Ответь строго валидным JSON без markdown: {"title": "Название детали и бренд с артикулом", "cost": "Цена и валюта", "is_oil": boolean, "is_fuel_filter": boolean, "is_air_filter": boolean, "is_cabin_filter": boolean, "is_brake": boolean}' },
                  { inline_data: { mime_type: file.type || 'image/jpeg', data: base64Data } }
                ]
              }]
            })
          });
          const resData = await response.json();
          let raw = resData.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
          raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
          const info = JSON.parse(raw);

          if (info.title) document.getElementById('entryTitle').value = info.title;
          if (info.cost) document.getElementById('entryCost').value = info.cost;
          if (info.is_oil) document.getElementById('chk-oil').checked = true;
          if (info.is_fuel_filter) document.getElementById('chk-fuel_filter').checked = true;
          if (info.is_air_filter) document.getElementById('chk-air_filter').checked = true;
          if (info.is_cabin_filter) document.getElementById('chk-cabin_filter').checked = true;
          if (info.is_brake) document.getElementById('chk-brake_pads').checked = true;

          status.innerText = 'Фото распознано!';
        } catch (err) {
          status.innerText = 'Ошибка разбора фото. Заполните вручную.';
        }
      };
      reader.readAsDataURL(file);
    };

    // 3. Подбор запчастей по VIN через Gemini
    document.getElementById('aiFindPartBtn').onclick = async () => {
      const q = document.getElementById('aiPartQuery').value.trim();
      const car = getActiveCar();
      if (!q) return;

      const resBox = document.getElementById('aiPartResult');
      resBox.classList.remove('hidden');
      resBox.innerText = 'Подбираю запчасти и кросс-номера...';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Автомобиль: ${car.name} (${car.sub}), VIN: ${car.vin || 'не указан'}. Запрос детали: "${q}". Подбери оригинальный OEM-номер и 2-3 надёжных кросс-артикула (Mann, Lemforder, TRW, Gates, Bosch и т.д.). Ответь кратко, списком артикулов с названиями брендов.`
              }]
            }]
          })
        });
        const d = await response.json();
        resBox.innerText = d.candidates?.[0]?.content?.parts?.[0]?.text || 'Ничего не найдено';
      } catch (e) {
        resBox.innerText = 'Ошибка подключения к AI-сервису подбора.';
      }
    };

    // Первый запуск
    renderApp();
  </script>
</body>
</html>
